# render.yaml — SatyaDrishti Render Deployment
# Uses Docker runtime so we can install tesseract-ocr system binary.
# Render Docker = full Ubuntu image = apt-get works during image build.

services:
  - type: web
    name: satyadrishti-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon

    envVars:
      - key: GEMINI_VISION_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: "ap-south-1"
